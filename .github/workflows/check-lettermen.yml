name: Check lettermen

# Fetches the UT all-time lettermen article and cross-checks it against the
# scraped basketball rosters. Runs on GitHub, which has open internet access.

on:
  workflow_dispatch:
  push:
    branches: [claude/github-repo-setup-fk0u3k]
    paths:
      - projects/name-a-vol/scripts/fetch_lettermen.py
      - .github/workflows/check-lettermen.yml

permissions:
  contents: write

concurrency:
  group: check-lettermen
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch lettermen
        working-directory: projects/name-a-vol
        run: python scripts/fetch_lettermen.py
      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A projects/name-a-vol/data/ || true
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Add lettermen cross-check data [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
