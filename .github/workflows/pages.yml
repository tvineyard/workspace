name: Deploy Pages

# Publishes the repository as a static site.
#
# Only needed if Pages is set to the "GitHub Actions" source. If Pages is set to
# "Deploy from a branch" (simpler) this workflow is unnecessary.
#
# It cannot switch Pages on by itself: creating a Pages site requires admin
# permission, and a workflow's GITHUB_TOKEN never exceeds write, so
# configure-pages with enablement:true fails with "Resource not accessible by
# integration". A repository admin has to enable Pages once, after which this
# deploys. Manual trigger only, so it does not fail on every push.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show URL
        run: echo "Published at ${{ steps.deployment.outputs.page_url }}"
